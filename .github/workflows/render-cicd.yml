name: Render CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci:
    name: Build and test in Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build CI image (with dev dependencies)
        run: docker build --build-arg INSTALL_DEV=true -t catering-ci .

      - name: Run Laravel test suite
        run: >
          docker run --rm catering-ci sh -lc
          "cp .env.example .env &&
          php artisan key:generate --ansi &&
          touch database/database.sqlite &&
          php artisan migrate --force --ansi &&
          php artisan test --ansi"

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured."
            echo "Add it in GitHub repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy triggered successfully."
